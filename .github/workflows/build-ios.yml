# 免费云端构建:GitHub 公共仓库的 macOS runner 完全免费。
# 流程:xcodegen 生成工程 → 模拟器跑冒烟测试(viewDidLoad 启动崩溃防线)
#       → 模拟器安装启动截图 → 校验键盘扩展 Info.plist → 打包带版本号的未签名 ipa
# 产物 artifact:
#   simulator-screenshot  — 模拟器启动验证截图
#   unsigned-ipa-v<版本>  — 未签名 ipa,下载后自行签名安装
name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 选择最新 Xcode(优先 17.x,支持 iOS 27 SDK)
        run: |
          ls /Applications | grep Xcode || true
          XCODE_APP=$(ls -d /Applications/Xcode*17*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          echo "使用 $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: 安装 XcodeGen 并生成工程
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 模拟器冒烟测试(编译全量代码 + 真实加载键盘控制器 + 引擎/词库回归)
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "测试模拟器: $UDID"
          xcodebuild test \
            -project PinyinDemo.xcodeproj \
            -scheme PinyinDemo \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO | tail -40

      - name: 模拟器安装启动截图
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcodebuild build \
            -project PinyinDemo.xcodeproj \
            -scheme PinyinDemo \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO
          xcrun simctl boot "$UDID" || true
          APP=$(find build-sim/Build/Products -name "PinyinDemo.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.adi.demo.pinyinapp || true
          sleep 6
          xcrun simctl io "$UDID" screenshot simulator-screenshot.png || true

      - name: 校验键盘扩展 Info.plist(闪退排查:确认主类声明正确展开)
        run: |
          PLIST=$(find build-sim/Build/Products -path "*PinyinKeyboard.appex/Info.plist" | head -1)
          echo "=== 扩展 Info.plist NSExtension ==="
          /usr/libexec/PlistBuddy -c "Print :NSExtension" "$PLIST"
          echo "=== 版本 ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"
          echo "=== 扩展嵌入结构 ==="
          find build-sim/Build/Products -name "*.appex" -o -name "PinyinDemo.app" -maxdepth 6 | head -5

      - name: 真机未签名构建并打包 ipa(文件名带版本号)
        run: |
          xcodebuild build \
            -project PinyinDemo.xcodeproj \
            -scheme PinyinDemo \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO || echo "真机构建失败(可忽略,模拟器产物仍可上传)"
          APP=$(find build-device/Build/Products -name "PinyinDemo.app" -path "*iphoneos*" | head -1)
          if [ -n "$APP" ]; then
            VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
            BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
            IPA_NAME="PinyinKeyboard-v${VER}.${BUILD}-unsigned.ipa"
            echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
            rm -rf Payload && mkdir Payload
            cp -R "$APP" Payload/
            zip -qry "$IPA_NAME" Payload
            echo "打包完成: $IPA_NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: simulator-screenshot.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME || 'unsigned-ipa' }}
          path: ${{ env.IPA_NAME || 'PinyinKeyboard-unsigned.ipa' }}
          if-no-files-found: ignore
